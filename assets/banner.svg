<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">João Victor Lopes Rosa — full stack developer banner</title>
  <desc id="desc">Dark navy banner with the name João Victor Lopes Rosa, location and education chips, and a terminal panel listing current work: Aura Hub, Dueto and Basis.</desc>
  <defs>
    <linearGradient id="core" x1="132" y1="18" x2="1150" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1424" />
      <stop offset="0.55" stop-color="#0A111E" />
      <stop offset="1" stop-color="#0E1B31" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 120) rotate(90) scale(300 210)">
      <stop stop-color="#F4B400" stop-opacity="0.13" />
      <stop offset="1" stop-color="#F4B400" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4B400" stop-opacity="0" />
      <stop offset="0.5" stop-color="#F4B400" stop-opacity="0.9" />
      <stop offset="1" stop-color="#F4B400" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#F4B400" stop-opacity="0.75" />
      <stop offset="0.5" stop-color="#F4B400" stop-opacity="0.25" />
      <stop offset="1" stop-color="#F4B400" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#22314F" stroke-width="1" />
    </pattern>
    <clipPath id="rail">
      <rect x="72" y="353" width="1136" height="4" rx="2" />
    </clipPath>
    <style>
      .kicker {
        font: 600 12.5px 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
        fill: #8595AD;
        letter-spacing: 0.27em;
      }
      .name {
        font: 800 58px 'Clash Display', 'Geist', 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        fill: #F5F8FC;
        letter-spacing: -0.028em;
      }
      .tagline {
        font: 400 16.5px 'Geist', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
        fill: #C3CFE0;
      }
      .chip {
        font: 600 11px 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
        fill: #C3CFE0;
        letter-spacing: 0.08em;
      }
      .term-title {
        font: 500 11.5px 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
        fill: #8595AD;
      }
      .term {
        font: 500 14.5px 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace;
        fill: #C3CFE0;
      }
      .term-hi {
        fill: #F5F8FC;
        font-weight: 600;
      }
      .term-prompt {
        fill: #F4B400;
        font-weight: 700;
      }
      .term-out {
        fill: #9FB0C7;
      }
    </style>
  </defs>

  <rect x="8" y="8" width="1264" height="384" rx="30" fill="#060A12" stroke="#1B2740" />
  <rect x="18" y="18" width="1244" height="364" rx="23" fill="url(#core)" />
  <rect x="18" y="18" width="1244" height="364" rx="23" fill="url(#grid)" opacity="0.22" />
  <rect x="18" y="18" width="1244" height="364" rx="23" stroke="#FFFFFF" stroke-opacity="0.05" />
  <ellipse cx="980" cy="120" rx="300" ry="210" fill="url(#glow)" />

  <rect x="72" y="64" width="46" height="46" rx="13" fill="#0E1A30" stroke="#2A3A5C" />
  <text x="95" y="93" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', Consolas, monospace" font-size="17" font-weight="700" fill="#F4B400">JV</text>
  <text class="kicker" x="136" y="85">FULL STACK DEVELOPER</text>
  <rect x="136" y="97" width="58" height="2" rx="1" fill="url(#hair)" />

  <text class="name" x="70" y="188">JOÃO VICTOR</text>
  <text class="name" x="70" y="250">LOPES ROSA</text>
  <text class="tagline" x="72" y="296">Internal platforms and product systems, engineered with intent.</text>

  <rect x="72" y="322" width="736" height="1" fill="#22314F" />
  <rect x="72" y="322" width="196" height="1" fill="url(#hair)" />

  <g>
    <rect x="72" y="338" width="140" height="30" rx="15" fill="#0E1930" stroke="#22314F" />
    <text class="chip" x="90" y="357">JACAREÍ-SP · BR</text>

    <rect x="224" y="338" width="176" height="30" rx="15" fill="#0E1930" stroke="#22314F" />
    <circle cx="243" cy="353" r="3" fill="#F4B400">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;0.5;1" />
    </circle>
    <text class="chip" x="256" y="357">AUTOÚ · AURA HUB</text>

    <rect x="412" y="338" width="196" height="30" rx="15" fill="#0E1930" stroke="#22314F" />
    <text class="chip" x="430" y="357">DSM · FATEC 2025–2027</text>
  </g>

  <g>
    <rect x="704" y="76" width="504" height="248" rx="18" fill="#0A1424" stroke="#223354">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;0.5;1" />
    </rect>
    <rect x="712" y="84" width="488" height="232" rx="13" fill="#081020" stroke="#1B2740" />
    <rect x="712" y="84" width="488" height="232" rx="13" stroke="#FFFFFF" stroke-opacity="0.04" />

    <circle cx="734" cy="103" r="4" fill="#F87171" fill-opacity="0.75" />
    <circle cx="752" cy="103" r="4" fill="#FBBF24" fill-opacity="0.75" />
    <circle cx="770" cy="103" r="4" fill="#34D399" fill-opacity="0.75" />
    <text class="term-title" x="790" y="107">jv-l0pes@autou — ~/aura</text>
    <rect x="712" y="124" width="488" height="1" fill="#1B2740" />

    <text class="term" x="732" y="158"><tspan class="term-prompt">$</tspan><tspan class="term-out"> whoami</tspan></text>
    <text class="term" x="732" y="190"><tspan class="term-hi">joão victor</tspan><tspan class="term-out"> · full stack developer</tspan></text>
    <text class="term" x="732" y="222"><tspan class="term-prompt">$</tspan><tspan class="term-out"> focus --now</tspan></text>
    <text class="term" x="732" y="254"><tspan class="term-hi">aura-hub</tspan><tspan class="term-out"> · </tspan><tspan class="term-hi">dueto</tspan><tspan class="term-out"> · </tspan><tspan class="term-hi">basis</tspan></text>
    <text class="term" x="732" y="286"><tspan class="term-prompt">$</tspan></text>
    <rect x="752" y="272" width="9" height="17" fill="#F4B400">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.15s" repeatCount="indefinite" keyTimes="0;0.42;0.5;0.92;1" calcMode="discrete" />
    </rect>
  </g>

  <rect x="72" y="355.5" width="1136" height="1" fill="#1B2740" />
  <g clip-path="url(#rail)">
    <rect x="0" y="353" width="240" height="4" rx="2" fill="url(#shimmer)">
      <animateTransform attributeName="transform" type="translate" values="-260 0; 1140 0; 1140 0" dur="6.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.72;1" keySplines="0.4 0 0.2 1;0 0 1 1" />
    </rect>
  </g>
</svg>
